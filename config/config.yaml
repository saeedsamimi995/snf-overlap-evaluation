# Locked study configuration. Paths are relative to the repository root.
# Do not retune q1 discovery settings on TCGA, METABRIC, or GSE25066.

q1:
  discovery_cohort: gse96058
  n_genes: 2000
  min_shared_genes: 200
  knn_k: 15
  overlap_ratio: 0.75   # overwritten on discovery by choose_overlap_ratio
  communities: [4, 5, 6, 7, 8]
  bootstraps: 6
  bootstrap_fraction: 0.8
  stability_iterations: 120
  stability_restarts: 2
  fit_iterations: 250
  restarts: 5
  learning_rate: 0.05
  l1: 0.01
  n_neg: 8
  max_peak_ratio: 0.85
  min_stability_ari: 0.05
  seed: 42
  results_dir: results/q1
  harmonized_dir: data/harmonized
  gse96058:
    expression_file: "data/GSE96058_gene_expression_3273_samples_and_136_replicates_transformed.csv"
    clinical_file: "data/gse96058_clinical.csv"
    clinical_output: "data/prepared/gse96058_clinical.csv"
    os_time_unit: days
  tcga:
    expression_file: "data/Human__TCGA_BRCA__UNC__RNAseq__HiSeq_RNA__01_28_2016__BI__Gene__Firehose_RSEM_log2.cct"
    clinical_file: "data/brca_tcga_clinical_data.tsv"
    pam50_file: "data/tcga/brca_pancan_clinical_patient.txt"
    clinical_output: "data/prepared/tcga_clinical.csv"
    os_time_unit: months
  metabric:
    expression_file: "data/metabric/data_mrna_illumina_microarray.txt"
    patient_clinical: "data/metabric/data_clinical_patient.txt"
    sample_clinical: "data/metabric/data_clinical_sample.txt"
    output_dir: "data/metabric"
    os_time_unit: months

